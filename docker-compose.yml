services:
  db:
    image: postgres:16-alpine
    container_name: cart_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U postgres' ]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: cart_app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - '3005:3005'
    restart: unless-stopped
    command: sh -c "npx prisma generate && npx prisma migrate deploy && node dist/src/main.js"

volumes:
  db_data: